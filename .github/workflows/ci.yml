name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine (pytest + vendored skills suite)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
      - name: day-trader-skill unittest suite
        run: python -m unittest discover -s vendor/day-trader-skill/tests

  app:
    name: App (typecheck, lint, test, i18n, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - name: Web demo build
        run: npm run build:demo

  rust:
    name: Rust shell (cargo check + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Stub frontendDist (generate_context! needs ../dist to exist)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          if (-not (Test-Path ../dist/index.html)) { Set-Content ../dist/index.html "<!doctype html><title>Levelset</title>" }
      - run: cargo check --locked
      - run: cargo test --locked
