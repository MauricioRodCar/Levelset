[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levelset_engine"
version = "0.1.0"
description = "Levelset local engine: FastAPI wrapper around the day-trader skills"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4.21"]

[project.scripts]
levelset-engine = "levelset_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["levelset_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
